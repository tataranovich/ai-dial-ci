name: Docker Build Release workflow

on:
  workflow_call:
    inputs:
      bypass-checks:
        type: boolean
        description: Do not fail pipeline if checks failed
        default: false
      push-enabled:
        type: boolean
        description: Push the image to registry(ies)
        default: false
      trivy-enabled:
        type: boolean
        description: Enable Trivy scanning
        default: true
      trivy-severity:
        type: string
        description: Severities of vulnerabilities to fail the build
        default: "CRITICAL,HIGH"
      trivy-severity-for-sarif:
        type: string
        description: Severities of vulnerabilities in SARIF report
        default: "CRITICAL,HIGH"
      trivy-limit-severities-for-sarif:
        type: boolean
        description: By default SARIF format enforces output of all vulnerabilities regardless of configured severities. To override this behavior set this parameter to true and specify desired severities in the `trivy-severity-for-sarif` parameter
        default: true
      trivy-vuln-type:
        type: string
        description: Type of vulnerabilities to scan
        default: "os,library"
      trivy-scanners:
        type: string
        description: Comma-separated list of what security issues to detect
        default: "vuln,secret"
      trivy-ignore-unfixed:
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      image-names:
        type: string
        description: |
          Docker image base names without tags (newline-separated list-like string)
          ref: https://github.com/docker/metadata-action#images-input
        required: true
      image-tags:
        type: string
        description: |
          Docker image tags (or tag rules) for docker/metadata-action tags input
          ref: https://github.com/docker/metadata-action#tags-input
        required: true
      platforms:
        type: string
        description: Docker build platforms
        default: "linux/amd64"
      dockerfile-path:
        type: string
        description: Path to the Dockerfile
        default: "Dockerfile"
      build-args:
        type: string
        description: |
          Docker build arguments (newline-separated list-like string)
          ref: https://github.com/docker/build-push-action#inputs
        default: ""

jobs:
  # Converts the comma-separated platforms input into a JSON array so it can
  # be used as a matrix value (GitHub Actions expressions have no split()).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.json }}
    steps:
      - name: Convert platforms to JSON array
        id: platforms
        run: |
          echo "json=$(echo '${{ inputs.platforms }}' | tr -d ' ' | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  # Builds and pushes the image under a throwaway scan-only tag so Trivy can
  # scan the exact artifact that will be released, without exposing it under
  # its real tags until the scan passes.
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
    with:
      output: image
      push: ${{ inputs.push-enabled }}
      platforms: ${{ inputs.platforms }}
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=scan-${{ github.sha }}
      file: ${{ inputs.dockerfile-path }}
      build-args: ${{ inputs.build-args }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_BOT_TOKEN }}

  scan:
    if: ${{ inputs.trivy-enabled }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_BOT_TOKEN }}

      - name: Run Trivy scanner (JSON output, no fail)
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          CONTINUE_ON_ERROR: ${{ inputs.bypass-checks }} # Hack to use the input below as a boolean
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:scan-${{ github.sha }}
          format: "json"
          exit-code: "0" # Do not fail on findings here, should be handled in the latest "trivy convert" step
          output: "trivy-results.json"
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          vuln-type: ${{ inputs.trivy-vuln-type }}
          scanners: ${{ inputs.trivy-scanners }}
        continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
      - name: Generate Trivy report (SARIF)
        id: trivy-generate-sarif
        # Do not generate SARIF reports on private repos - GitHub Advanced Security is not enabled
        # Do not generate SARIF reports for pull requests from forks
        if: ${{ steps.trivy.outcome == 'success' && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        run: |
          trivy convert --format sarif --output trivy-results.sarif --exit-code 0 trivy-results.json
        shell: bash
        env:
          CONTINUE_ON_ERROR: ${{ inputs.bypass-checks }} # Hack to use the input below as a boolean
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          TRIVY_SEVERITY: ${{ fromJson(inputs.trivy-limit-severities-for-sarif) && inputs.trivy-severity-for-sarif || '' }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
      - name: Upload Trivy report (SARIF)
        if: ${{ steps.trivy-generate-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-${{ matrix.platform }}
        env:
          CONTINUE_ON_ERROR: ${{ inputs.bypass-checks }} # Hack to use the input below as a boolean
        continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
      - name: Generate Trivy report (Table, must fail on findings)
        if: ${{ steps.trivy.outcome == 'success' }}
        run: |
          trivy convert --format table --exit-code 1 trivy-results.json
        shell: bash
        env:
          CONTINUE_ON_ERROR: ${{ inputs.bypass-checks }} # Hack to use the input below as a boolean
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          TRIVY_DISABLE_VEX_NOTICE: true
        continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}

  # Promotes the already-scanned image to its real tags by copying the
  # manifest (no rebuild, no re-push of layers) once the scan has passed.
  publish:
    if: ${{ inputs.push-enabled }}
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        if: ${{ inputs.push-enabled }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTIONS_BOT_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.push-enabled }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Promote scanned image to release tags
        env:
          GHCR_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "${GHCR_TOKEN}" | crane auth login ghcr.io --username ${{ github.actor }} --password-stdin
          echo "${DOCKERHUB_TOKEN}" | crane auth login docker.io --username ${{ github.actor }} --password-stdin
          while IFS= read -r IMAGE_NAME; do
            [ -z "${IMAGE_NAME}" ] && continue
            while IFS= read -r IMAGE_TAG; do
              [ -z "${IMAGE_TAG}" ] && continue
              if echo "${IMAGE_TAG}" | grep -q type=raw; then
                IMAGE_TAG=$(echo "${IMAGE_TAG}" | tr ',' '\n' | grep value= | cut -d= -f2)
              fi
              crane copy "ghcr.io/${{ github.repository }}:scan-${{ github.sha }}" "${IMAGE_NAME}:${IMAGE_TAG}"
            done <<< "${{ inputs.image-tags }}"
          done <<< "${{ inputs.image-names }}"

  # Always removes the throwaway scan tag once the build exists, regardless
  # of whether the scan/publish steps succeeded, failed, or were skipped.
  cleanup-scan-tag:
    needs: [build, scan, publish]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          package: ${{ github.event.repository.name }}
          tags: scan-${{ github.sha }}